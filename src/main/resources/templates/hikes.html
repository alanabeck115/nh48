
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GridPeaks - Hiking Log</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f7f5;
        }

        h1 {
            color: #245b38;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 9px;
            text-align: left;
        }

        th {
            background: #245b38;
            color: white;
        }

        tr:nth-child(even) {
            background: #f0f4f0;
        }

        a {
            color: #245b38;
        }
    </style>
</head>

<body>

    <h1>GridPeaks Hiking Log</h1>

    <p>
        Total hikes:
        <strong th:text="${totalHikes}">0</strong>
    </p>

    <p><a href="/">Home</a></p>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Mountain</th>
                <th>Hiker</th>
                <th>Companions</th>
                <th>Trail</th>
                <th>Comment</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="hike : ${hikes}">
                
                    
                <td th:text="${hike.climb_date}"></td>    

                <td th:text="${hike.mountain}"></td>
                <td th:text="${hike.hiker}"></td>
                <td th:text="${hike.companions}"></td>
                <td th:text="${hike.trail}"></td>
                <td th:text="${hike.comment}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(hikes)}">
                <td colspan="6">No hikes have been entered yet.</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
