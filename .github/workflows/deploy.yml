name: Build Hiking Reports

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn clean package

      - name: Generate Reports
        run: |
          java -cp target/classes Mavenjava.mylist
          java -cp target/classes Mavenjava.companions
          java -cp target/classes Mavenjava.NH48HtmlExport
          java -cp target/classes Mavenjava.gridmountainsleft
          java -cp target/classes Mavenjava.alanpeaks

      - name: Commit Generated Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/

          git diff --cached --quiet || git commit -m "Auto-update reports"

          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4