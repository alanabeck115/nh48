name: Build Hiking Reports

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    
      # Keep your existing build and report-generation steps here.
      # Keep the Commit Generated Files step here as well.

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn clean package

      - name: Verify MyList compilation
        run: test -f target/classes/Mavenjava/MyList.class

      - name: Generate Reports
        run: |
          java -cp target/classes Mavenjava.MyList
          java -cp target/classes Mavenjava.companions
          java -cp target/classes Mavenjava.NH48HtmlExport
          java -cp target/classes Mavenjava.alanpeaks

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p docs
          find . -maxdepth 1 -name "*.html" -type f \
            -exec cp {} docs/ \;
          echo "Files prepared for GitHub Pages:"
          ls -la docs
          
      - name: Commit Generated Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/

          git diff --cached --quiet || git commit -m "Auto-update reports"

          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

        
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
